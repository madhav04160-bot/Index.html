<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird HD Arcade - Bad Power-Ups Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-color: #080c14;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  #game-container {
    position: relative;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    border-radius: 16px;
    overflow: hidden;
    border: 4px solid #1e293b;
  }

  canvas {
    display: block;
  }

  .instructions {
    margin-top: 14px;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>
<div class="instructions">Tap / Click or Press <b>SPACE</b> to Flap / Select</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Web Audio API Sound System ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  
  const now = audioCtx.currentTime;

  if (type === 'flap') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);

  } else if (type === 'score') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.25);

  } else if (type === 'hit') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);

  } else if (type === 'goodPowerUp') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.25);

  } else if (type === 'badPowerUp') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.linearRampToValueAtTime(150, now + 0.3);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);

  } else if (type === 'click') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  }
}

// Game States
const STATE_MENU = 0;
const STATE_PLAYING = 1;
const STATE_GAMEOVER = 2;
const STATE_LEADERBOARD = 3;
const STATE_POWERUPS_INFO = 4;
let gameState = STATE_MENU;

let frames = 0;
let score = 0;

// Power-Up Settings & States
let powerUpsEnabled = true;
let activePowerUp = null; // 'shrink', 'invert', 'heavy', 'speed'
let powerUpTimer = 0;

// Leaderboard Storage
let leaderboard = JSON.parse(localStorage.getItem('flappy_hd_fixed_lb')) || [
  { name: 'ACE', score: 15 },
  { name: 'FLY', score: 10 },
  { name: 'SKY', score: 5 }
];

const BASE_GRAVITY = 0.23;
const BASE_JUMP = -5.3;

let activeItems = [];
let particles = [];

function saveScoreSilent(newScore) {
  if (newScore <= 0) return;
  leaderboard.push({ name: 'YOU', score: newScore });
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 5);
  localStorage.setItem('flappy_hd_fixed_lb', JSON.stringify(leaderboard));
}

// Parallax Background Clouds
const clouds = Array.from({ length: 6 }, () => ({
  x: Math.random() * canvas.width,
  y: 20 + Math.random() * 120,
  speed: 0.2 + Math.random() * 0.3,
  radius: 16 + Math.random() * 10
}));

function spawnFeathers(x, y, isBad = false) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 3.5,
      vy: (Math.random() - 0.5) * 3.5,
      size: 2 + Math.random() * 3,
      color: isBad ? '#ef4444' : (Math.random() > 0.5 ? '#facc15' : '#38bdf8'),
      alpha: 1
    });
  }
}

// Bird
const bird = {
  x: 70,
  y: 240,
  baseW: 34,
  baseH: 26,
  w: 34,
  h: 26,
  velocity: 0,
  rotation: 0,
  wingAngle: 0,
  hasShield: false,
  invulnerableTimer: 0,

  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

    this.rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 6, this.velocity * 0.09));
    ctx.rotate(this.rotation);

    if (gameState === STATE_PLAYING) {
      this.wingAngle = Math.sin(frames * 0.3) * 0.6;
    } else {
      this.wingAngle = Math.sin(frames * 0.1) * 0.3;
    }

    // Shield Barrier
    if (this.hasShield) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // Temporary Invincibility Flash
    if (this.invulnerableTimer > 0 && Math.floor(frames / 4) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    // Tail
    ctx.fillStyle = '#ea580c';
    ctx.beginPath();
    ctx.moveTo(-this.w / 2 + 2, -2);
    ctx.lineTo(-this.w / 2 - 8, -8);
    ctx.lineTo(-this.w / 2 - 6, 0);
    ctx.lineTo(-this.w / 2 - 8, 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#7c2d12';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Body Gradient
    const bodyGrad = ctx.createLinearGradient(-this.w/2, -this.h/2, this.w/2, this.h/2);
    if (activePowerUp === 'invert' || activePowerUp === 'heavy' || activePowerUp === 'speed') {
      bodyGrad.addColorStop(0, '#f87171');
      bodyGrad.addColorStop(0.6, '#dc2626');
      bodyGrad.addColorStop(1, '#991b1b');
    } else {
      bodyGrad.addColorStop(0, '#fde047');
      bodyGrad.addColorStop(0.6, '#eab308');
      bodyGrad.addColorStop(1, '#ca8a04');
    }

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.w / 4, -this.h / 5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(this.w / 4 + 1.5, -this.h / 5, 2.8, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    const beakGrad = ctx.createLinearGradient(this.w/4, -2, this.w/2 + 6, 4);
    beakGrad.addColorStop(0, '#f97316');
    beakGrad.addColorStop(1, '#c2410c');

    ctx.fillStyle = beakGrad;
    ctx.beginPath();
    ctx.moveTo(this.w / 4, -2);
    ctx.quadraticCurveTo(this.w / 2 + 8, 0, this.w / 2 + 8, 4);
    ctx.quadraticCurveTo(this.w / 3, 8, this.w / 4 - 2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Wing
    ctx.save();
    ctx.translate(-4, 0);
    ctx.rotate(this.wingAngle);
    ctx.fillStyle = activePowerUp === 'heavy' ? '#ef4444' : '#facc15';
    ctx.beginPath();
    ctx.ellipse(-2, 0, 8, 5, -Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  },

  update() {
    if (gameState === STATE_PLAYING) {
      let currentGravity = BASE_GRAVITY;

      if (activePowerUp === 'invert') {
        currentGravity = -BASE_GRAVITY * 1.2;
      } else if (activePowerUp === 'heavy') {
        currentGravity = BASE_GRAVITY * 1.8;
      }

      this.velocity += currentGravity;
      this.y += this.velocity;

      if (this.invulnerableTimer > 0) {
        this.invulnerableTimer--;
      }

      if (activePowerUp === 'shrink') {
        this.w = this.baseW * 0.7;
        this.h = this.baseH * 0.7;
      } else {
        this.w = this.baseW;
        this.h = this.baseH;
      }

      if (this.y + this.h >= canvas.height - 90) {
        this.y = canvas.height - 90 - this.h;
        handleBirdCollision(null);
      }

      if (this.y <= 0) {
        this.y = 0;
        this.velocity = 0;
      }
    } else {
      this.y = 240 + Math.sin(frames * 0.08) * 8;
    }
  },

  jump() {
    let jumpForce = BASE_JUMP;
    
    if (activePowerUp === 'invert') {
      jumpForce = -BASE_JUMP * 0.85;
    } else if (activePowerUp === 'heavy') {
      jumpForce = BASE_JUMP * 0.75;
    }

    this.velocity = jumpForce;
    playSound('flap');
    spawnFeathers(this.x, this.y + this.h, activePowerUp === 'invert' || activePowerUp === 'heavy');
  }
};

// Pipe Obstacle Engine
const pipes = {
  items: [],
  gap: 135,
  width: 56,
  baseSpeed: 2.1,
  minSpacing: 200,

  draw() {
    this.items.forEach(p => {
      const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
      pipeGrad.addColorStop(0, '#15803d');
      pipeGrad.addColorStop(0.2, '#4ade80');
      pipeGrad.addColorStop(0.5, '#22c55e');
      pipeGrad.addColorStop(1, '#14532d');

      ctx.fillStyle = pipeGrad;
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2.5;

      // Top Pipe
      ctx.fillRect(p.x, 0, this.width, p.top);
      ctx.strokeRect(p.x, 0, this.width, p.top);
      ctx.fillRect(p.x - 4, p.top - 22, this.width + 8, 22);
      ctx.strokeRect(p.x - 4, p.top - 22, this.width + 8, 22);

      // Bottom Pipe
      const bottomY = p.top + this.gap;
      const bottomH = canvas.height - 90 - bottomY;
      ctx.fillRect(p.x, bottomY, this.width, bottomH);
      ctx.strokeRect(p.x, bottomY, this.width, bottomH);
      ctx.fillRect(p.x - 4, bottomY, this.width + 8, 22);
      ctx.strokeRect(p.x - 4, bottomY, this.width + 8, 22);
    });
  },

  update() {
    if (gameState !== STATE_PLAYING) return;

    const currentSpeed = activePowerUp === 'speed' ? this.baseSpeed * 1.6 : this.baseSpeed;

    const lastPipe = this.items[this.items.length - 1];
    if (!lastPipe || (canvas.width - lastPipe.x) >= this.minSpacing) {
      const minTop = 60;
      const maxTop = canvas.height - 90 - this.gap - 60;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

      this.items.push({ x: canvas.width, top: topHeight, passed: false });

      if (powerUpsEnabled && Math.random() < 0.55) {
        const isBad = Math.random() < 0.45;
        let chosenType = 'shield';

        if (isBad) {
          const badTypes = ['invert', 'heavy', 'speed'];
          chosenType = badTypes[Math.floor(Math.random() * badTypes.length)];
        } else {
          const goodTypes = ['shield', 'shrink', 'bonus'];
          chosenType = goodTypes[Math.floor(Math.random() * goodTypes.length)];
        }

        activeItems.push({
          x: canvas.width + this.width / 2,
          y: topHeight + this.gap / 2,
          type: chosenType,
          isBad
        });
      }
    }

    this.items.forEach((p, index) => {
      p.x -= currentSpeed;

      const bLeft = bird.x + 4;
      const bRight = bird.x + bird.w - 4;
      const bTop = bird.y + 4;
      const bBottom = bird.y + bird.h - 4;

      if (
        bRight > p.x && bLeft < p.x + this.width &&
        (bTop < p.top || bBottom > p.top + this.gap)
      ) {
        handleBirdCollision(p);
      }

      if (p.x + this.width < bird.x && !p.passed) {
        p.passed = true;
        score++;
        playSound('score');
      }

      if (p.x + this.width < -10) this.items.splice(index, 1);
    });
  },

  reset() { this.items = []; }
};

// Power-Up System
function updatePowerUps() {
  if (gameState !== STATE_PLAYING) return;

  if (powerUpTimer > 0) {
    powerUpTimer--;
    if (powerUpTimer === 0) activePowerUp = null;
  }

  const currentSpeed = activePowerUp === 'speed' ? pipes.baseSpeed * 1.6 : pipes.baseSpeed;

  activeItems.forEach((item, idx) => {
    item.x -= currentSpeed;

    ctx.save();
    ctx.beginPath();
    ctx.arc(item.x, item.y, 14, 0, Math.PI * 2);

    if (item.isBad) {
      ctx.fillStyle = '#ef4444';
    } else {
      if (item.type === 'shield') ctx.fillStyle = '#38bdf8';
      else if (item.type === 'shrink') ctx.fillStyle = '#facc15';
      else ctx.fillStyle = '#c084fc';
    }

    ctx.fill();
    ctx.strokeStyle = item.isBad ? '#fee2e2' : '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 12px sans-serif';
    ctx.textAlign = 'center';

    let icon = '🛡️';
    if (item.type === 'shrink') icon = '⚡';
    else if (item.type === 'bonus') icon = '+3';
    else if (item.type === 'invert') icon = '💀';
    else if (item.type === 'heavy') icon = '🐘';
    else if (item.type === 'speed') icon = '⏩';

    ctx.fillText(icon, item.x, item.y + 4);
    ctx.restore();

    const dist = Math.hypot(bird.x + bird.w/2 - item.x, bird.y + bird.h/2 - item.y);
    if (dist < bird.w / 2 + 14) {
      if (item.type === 'shield') {
        bird.hasShield = true;
        playSound('goodPowerUp');
      } else if (item.type === 'shrink') {
        activePowerUp = 'shrink';
        powerUpTimer = 300;
        playSound('goodPowerUp');
      } else if (item.type === 'bonus') {
        score += 3;
        playSound('goodPowerUp');
      } else if (item.type === 'invert') {
        activePowerUp = 'invert';
        powerUpTimer = 300;
        playSound('badPowerUp');
      } else if (item.type === 'heavy') {
        activePowerUp = 'heavy';
        powerUpTimer = 300;
        playSound('badPowerUp');
      } else if (item.type === 'speed') {
        activePowerUp = 'speed';
        powerUpTimer = 300;
        playSound('badPowerUp');
      }

      spawnFeathers(item.x, item.y, item.isBad);
      activeItems.splice(idx, 1);
    }
  });
}

function handleBirdCollision(collidedPipe) {
  if (bird.invulnerableTimer > 0) return;

  if (bird.hasShield) {
    bird.hasShield = false;
    bird.invulnerableTimer = 60;
    bird.velocity = BASE_JUMP * 0.8;
    playSound('hit');
    spawnFeathers(bird.x + bird.w/2, bird.y + bird.h/2);

    if (collidedPipe) {
      collidedPipe.x += 40;
    }
  } else {
    triggerGameOver();
  }
}

const environment = {
  draw() {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#38bdf8');
    skyGrad.addColorStop(0.6, '#bae6fd');
    skyGrad.addColorStop(1, '#f0f9ff');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
      ctx.arc(c.x + 10, c.y - 6, c.radius * 0.8, 0, Math.PI * 2);
      ctx.arc(c.x + 20, c.y, c.radius * 0.9, 0, Math.PI * 2);
      ctx.fill();

      if (gameState === STATE_PLAYING) {
        c.x -= c.speed;
        if (c.x + 30 < 0) c.x = canvas.width + 30;
      }
    });

    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, canvas.height - 90, canvas.width, 16);
    ctx.strokeStyle = '#15803d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height - 90);
    ctx.lineTo(canvas.width, canvas.height - 90);
    ctx.stroke();
  }
};

function triggerGameOver() {
  playSound('hit');
  gameState = STATE_GAMEOVER;
  saveScoreSilent(score);
}

function resetGame() {
  bird.y = 240;
  bird.velocity = 0;
  bird.hasShield = false;
  bird.invulnerableTimer = 0;
  activePowerUp = null;
  pipes.reset();
  activeItems = [];
  particles = [];
  score = 0;
  frames = 0;
  gameState = STATE_PLAYING;
}

function drawButton(text, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(canvas.width / 2 - 90, y - 20, 180, 42);

  ctx.fillStyle = '#ffffff';
  ctx.font = '700 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, canvas.width / 2, y + 6);
}

function drawUI() {
  if (gameState === STATE_MENU) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('FLAPPY ARCADE', canvas.width / 2, 130);

    drawButton('PLAY GAME', 230, '#22c55e');
    drawButton(powerUpsEnabled ? 'POWER-UPS: ON' : 'POWER-UPS: OFF', 290, powerUpsEnabled ? '#0284c7' : '#64748b');
    drawButton('LEADERBOARD', 350, '#2563eb');
    drawButton('POWER-UPS GUIDE', 410, '#a855f7');

  } else if (gameState === STATE_PLAYING) {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 4;
    ctx.font = '900 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(score, canvas.width / 2, 70);
    ctx.fillText(score, canvas.width / 2, 70);

    if (powerUpTimer > 0) {
      ctx.font = '700 13px sans-serif';
      const timeLeft = Math.ceil(powerUpTimer / 60);

      if (activePowerUp === 'shrink') {
        ctx.fillStyle = '#facc15';
        ctx.fillText(`⚡ SHRINK MODE (${timeLeft}s)`, canvas.width / 2, 100);
      } else if (activePowerUp === 'invert') {
        ctx.fillStyle = '#ef4444';
        ctx.fillText(`💀 INVERTED GRAVITY! TAP TO FALL (${timeLeft}s)`, canvas.width / 2, 100);
      } else if (activePowerUp === 'heavy') {
        ctx.fillStyle = '#ef4444';
        ctx.fillText(`🐘 HEAVY GRAVITY! (${timeLeft}s)`, canvas.width / 2, 100);
      } else if (activePowerUp === 'speed') {
        ctx.fillStyle = '#ef4444';
        ctx.fillText(`⏩ SPEED RUSH! (${timeLeft}s)`, canvas.width / 2, 100);
      }
    }

  } else if (gameState === STATE_LEADERBOARD) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#facc15';
    ctx.font = '900 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TOP PILOTS', canvas.width / 2, 120);

    leaderboard.forEach((entry, idx) => {
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 17px monospace';
      ctx.fillText(`${idx + 1}. ${entry.name} ------ ${entry.score} PTS`, canvas.width / 2, 180 + idx * 40);
    });

    drawButton('BACK TO MENU', 460, '#64748b');

  } else if (gameState === STATE_POWERUPS_INFO) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '900 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GOOD POWER-UPS', canvas.width / 2 , 60);
ctx.font = '600 13px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('🛡️ Shield: Absorbs 1 hit', canvas.width / 2, 90);
    ctx.fillText('⚡ Shrink: 30% smaller bird', canvas.width / 2, 115);
    ctx.fillText('💜 Bonus: Grants +3 extra pts', canvas.width / 2, 140);

    ctx.fillStyle = '#ef4444';
    ctx.font = '900 20px sans-serif';
    ctx.fillText('BAD POWER-UPS 💀', canvas.width / 2, 195);

    ctx.font = '600 13px sans-serif';
    ctx.fillStyle = '#fca5a5';
    ctx.fillText('💀 Invert: Auto-fly up, tap to push down', canvas.width / 2, 225);
    ctx.fillText('🐘 Heavy: High gravity & weak jump', canvas.width / 2, 250);
    ctx.fillText('⏩ Speed Rush: Fast scrolling pipes', canvas.width / 2, 275);

    drawButton(powerUpsEnabled ? 'POWER-UPS: ENABLED' : 'POWER-UPS: DISABLED', 350, powerUpsEnabled ? '#0284c7' : '#64748b');
    drawButton('BACK TO MENU', 460, '#64748b');

  } else if (gameState === STATE_GAMEOVER) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ef4444';
    ctx.font = '900 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, 180);

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 20px sans-serif';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 230);

    drawButton('RETRY', 300, '#22c55e');
    drawButton('MAIN MENU', 360, '#64748b');
  }
}

function updateParticles() {
  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;

    if (p.alpha <= 0) {
      particles.splice(index, 1);
    } else {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

function handleCanvasClick(e) {
  initAudio(); // Initialize audio context on first user gesture

  const rect = canvas.getBoundingClientRect();
  const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

  if (gameState === STATE_MENU) {
    if (clickY >= 210 && clickY <= 252) { playSound('click'); resetGame(); }
    else if (clickY >= 270 && clickY <= 312) { playSound('click'); powerUpsEnabled = !powerUpsEnabled; }
    else if (clickY >= 330 && clickY <= 372) { playSound('click'); gameState = STATE_LEADERBOARD; }
    else if (clickY >= 390 && clickY <= 432) { playSound('click'); gameState = STATE_POWERUPS_INFO; }
  } else if (gameState === STATE_LEADERBOARD) {
    if (clickY >= 440 && clickY <= 482) { playSound('click'); gameState = STATE_MENU; }
  } else if (gameState === STATE_POWERUPS_INFO) {
    if (clickY >= 330 && clickY <= 372) { playSound('click'); powerUpsEnabled = !powerUpsEnabled; }
    else if (clickY >= 440 && clickY <= 482) { playSound('click'); gameState = STATE_MENU; }
  } else if (gameState === STATE_PLAYING) {
    bird.jump();
  } else if (gameState === STATE_GAMEOVER) {
    if (clickY >= 280 && clickY <= 322) { playSound('click'); resetGame(); }
    else if (clickY >= 340 && clickY <= 382) { playSound('click'); gameState = STATE_MENU; }
  }
}

canvas.addEventListener('mousedown', handleCanvasClick);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleCanvasClick(e); });
window.addEventListener('keydown', e => { 
  initAudio();
  if (e.code === 'Space') { 
    e.preventDefault(); 
    if (gameState === STATE_PLAYING) bird.jump(); 
  } 
});

function loop() {
  frames++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  environment.draw();

  pipes.update();
  pipes.draw();

  updatePowerUps();
  
  bird.update();
  bird.draw();

  updateParticles();
  drawUI();

  requestAnimationFrame(loop);
}

// Start Game Engine
loop();
</script>
